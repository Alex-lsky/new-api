name: Publish custom image to Aliyun (release/custom-image)

# Builds and pushes the self-maintained fork image to Aliyun Container Registry
# whenever the release/custom-image branch is updated (direct push or merge).
# Single-arch (amd64) to match the deployment server. The image is tagged both
# as :latest and as a dated version tag for rollback.
on:
  push:
    branches:
      - release/custom-image
  workflow_dispatch: # 允许手动触发重建

permissions:
  contents: read

jobs:
  build-and-push:
    name: Build & push to Aliyun ACR
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 1

      - name: Resolve version tag
        id: version
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          VERSION="custom-$(date -u +'%Y%m%d')-${SHORT_SHA}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Publishing version: ${VERSION}"

      - name: Write VERSION file
        run: |
          echo "${{ steps.version.outputs.version }}" > VERSION

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to Aliyun Container Registry
        uses: docker/login-action@c99871dec2022cc055c062a10cc1a1310835ceb4 # v4.3.0
        with:
          registry: registry.cn-hangzhou.aliyuncs.com
          username: ${{ secrets.ALIYUN_REGISTRY_USERNAME }}
          password: ${{ secrets.ALIYUN_REGISTRY_PASSWORD }}

      - name: Build & push image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            registry.cn-hangzhou.aliyuncs.com/sky-devops/new-api:latest
            registry.cn-hangzhou.aliyuncs.com/sky-devops/new-api:${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Aliyun personal-edition ACR rejects the OCI attestation manifests
          # newer buildkit emits (unknown manifest class for
          # application/vnd.oci.empty.v1+json); disable provenance/SBOM.
          provenance: false
          sbom: false

      - name: Image summary
        run: |
          echo "### 阿里云镜像发布成功 / Aliyun ACR push done" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "registry.cn-hangzhou.aliyuncs.com/sky-devops/new-api:latest" >> $GITHUB_STEP_SUMMARY
          echo "registry.cn-hangzhou.aliyuncs.com/sky-devops/new-api:${{ steps.version.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "digest: ${{ steps.build.outputs.digest }}" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
